name: Validate Resource Finder 1.9.4-dev7 full phone and TV regression

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-resource-finder-dev7-full-regression.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rf-smart-buffer-dev7-full-regression
  cancel-in-progress: true

env:
  PRIVATE_SOURCE_SHA: ee793f6eef0f65994f269c664cf5148b88e36bc7
  SIGNER_SHA256: 73878e388879a837760bb3c500ff415d0ce54f92cf36b8421557abcf98cfdcf4

jobs:
  phone-full-regression:
    if: github.actor == 'bonjourdrs' && github.repository == 'bonjourdrs/resource-finder-ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Require existing private source credential
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout pinned dev7 source and original signer
        uses: actions/checkout@v4
        with:
          repository: bonjourdrs/codex-test
          ref: ee793f6eef0f65994f269c664cf5148b88e36bc7
          token: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: |
            resource_finder/android
            v1_0/signing/resourcefinder_debug.keystore.b64
          sparse-checkout-cone-mode: false

      - name: Verify exact dev7 source
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          grep -Fq 'versionCode = 206' private-source/resource_finder/android/app/build.gradle.kts
          grep -Fq 'versionName = "1.9.4-dev7"' private-source/resource_finder/android/app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Restore original signer on ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base64 --decode private-source/v1_0/signing/resourcefinder_debug.keystore.b64 > "$RUNNER_TEMP/rf-dev7.keystore"
          echo "RF_KEYSTORE_PATH=$RUNNER_TEMP/rf-dev7.keystore" >> "$GITHUB_ENV"

      - name: Run all JVM tests and build phone APKs
        run: |
          set -euo pipefail
          gradle -p private-source/resource_finder/android --no-daemon \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify dev7 package and original signer
        run: |
          set -euo pipefail
          apk=private-source/resource_finder/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='com.resourcefinder.standalone' versionCode='206' versionName='1.9.4-dev7'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
            grep -Fi "Signer #1 certificate SHA-256 digest: $SIGNER_SHA256"

      - name: Free disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: RF_ANDROID_TEST_NOT_PACKAGE=com.resourcefinder.app.tv bash private-source/resource_finder/android/ci-device-check.sh

      - name: Require full phone suite including dev7 prefetch tests
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path("private-source/resource_finder/android/app/build/outputs/androidTest-results")
          files = list(root.rglob("TEST-*.xml"))
          assert files, "No phone instrumentation XML report"
          total = sum(int(ET.parse(f).getroot().get("tests", "0")) for f in files)
          failures = sum(int(ET.parse(f).getroot().get("failures", "0")) for f in files)
          errors = sum(int(ET.parse(f).getroot().get("errors", "0")) for f in files)
          print({"phone_tests": total, "failures": failures, "errors": errors})
          assert total >= 50, f"Expected at least 50 phone tests (48 dev6 baseline + 2 dev7), got {total}"
          assert failures == 0 and errors == 0
          PY

      - name: Upload full phone regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Resource-Finder-v1.9.4-dev7-full-phone-regression
          path: |
            private-source/resource_finder/android/app/build/reports/tests/
            private-source/resource_finder/android/app/build/reports/androidTests/
            private-source/resource_finder/android/app/build/outputs/androidTest-results/
            private-source/resource_finder/android/app/build/ui-validation/
          if-no-files-found: warn
          retention-days: 14

  tv-full-regression:
    if: github.actor == 'bonjourdrs' && github.repository == 'bonjourdrs/resource-finder-ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Require existing private source credential
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout pinned dev7 source and original signer
        uses: actions/checkout@v4
        with:
          repository: bonjourdrs/codex-test
          ref: ee793f6eef0f65994f269c664cf5148b88e36bc7
          token: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: |
            resource_finder/android
            v1_0/signing/resourcefinder_debug.keystore.b64
          sparse-checkout-cone-mode: false

      - name: Verify exact dev7 source
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          grep -Fq 'versionCode = 206' private-source/resource_finder/android/app/build.gradle.kts
          grep -Fq 'versionName = "1.9.4-dev7"' private-source/resource_finder/android/app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Restore original signer on ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base64 --decode private-source/v1_0/signing/resourcefinder_debug.keystore.b64 > "$RUNNER_TEMP/rf-dev7-tv.keystore"
          echo "RF_KEYSTORE_PATH=$RUNNER_TEMP/rf-dev7-tv.keystore" >> "$GITHUB_ENV"

      - name: Compile dev7 phone and instrumentation APKs
        run: |
          set -euo pipefail
          gradle -p private-source/resource_finder/android --no-daemon \
            :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Free disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: true
          disk-size: 4096M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash private-source/resource_finder/android/ci-tv-test-suite.sh
            adb install -r private-source/resource_finder/android/app/build/outputs/apk/debug/app-debug.apk
            bash private-source/resource_finder/android/ci-cold-start-measure.sh

      - name: Upload full TV regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Resource-Finder-v1.9.4-dev7-full-tv-regression
          path: |
            private-source/resource_finder/android/app/build/reports/androidTests/
            private-source/resource_finder/android/app/build/outputs/androidTest-results/
            private-source/resource_finder/android/app/build/ui-validation/
            private-source/resource_finder/android/app/build/tv-ci-reports/
          if-no-files-found: warn
          retention-days: 14
