name: Validate Resource Finder 1.8 TV remote regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-resource-finder-tv-performance18.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-home-remote-validation-performance18
  cancel-in-progress: true

jobs:
  tv-emulator:
    if: github.actor == 'bonjourdrs' && github.repository == 'bonjourdrs/resource-finder-ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Ensure narrowly scoped source token exists
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_READ_TOKEN" || { echo "::error::Missing RF_PRIVATE_REPO_READ_TOKEN"; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: bonjourdrs/codex-test
          ref: resource-finder-1.8-performance
          token: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: |
            resource_finder/android
            v1_0/signing/resourcefinder_debug.keystore.b64
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: true
      - name: Restore original signer for Android test compilation
        run: |
          set -euo pipefail
          umask 077
          base64 --decode private-source/v1_0/signing/resourcefinder_debug.keystore.b64 > "$RUNNER_TEMP/rf-existing-signer.keystore"
          echo "RF_KEYSTORE_PATH=$RUNNER_TEMP/rf-existing-signer.keystore" >> "$GITHUB_ENV"

      - name: Compile TV and instrumentation APKs
        working-directory: private-source/resource_finder/android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: true
          disk-size: 4096M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            RF_KEYSTORE_PATH="$RUNNER_TEMP/rf-existing-signer.keystore" RF_ANDROID_TEST_CLASS=com.resourcefinder.app.tv.TvAppDeviceTest bash private-source/resource_finder/android/ci-device-check.sh
            RF_KEYSTORE_PATH="$RUNNER_TEMP/rf-existing-signer.keystore" RF_ANDROID_TEST_CLASS=com.resourcefinder.app.tv.TvSidebarDeviceTest bash private-source/resource_finder/android/ci-device-check.sh
            RF_KEYSTORE_PATH="$RUNNER_TEMP/rf-existing-signer.keystore" RF_ANDROID_TEST_CLASS=com.resourcefinder.app.tv.TvPlayerDeviceTest bash private-source/resource_finder/android/ci-device-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resource-Finder-1.8-TV-remote-report
          path: |
            private-source/resource_finder/android/app/build/reports/androidTests
            private-source/resource_finder/android/app/build/outputs/androidTest-results
            private-source/resource_finder/android/app/build/ui-validation
          if-no-files-found: warn
          retention-days: 3

