name: Build BatteryLite 1.2 OnePlus 13 APK (stable signature)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-battery-lite-oneplus13.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battery-lite-oneplus13-public-build
  cancel-in-progress: true

jobs:
  android:
    # Keep the private-source checkout limited to the repository owner.
    if: github.actor == 'bonjourdrs' && github.repository == 'bonjourdrs/resource-finder-ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify read-only private-source credential exists
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "::error::Missing Actions secret RF_PRIVATE_REPO_READ_TOKEN. Use the existing fine-grained token scoped only to bonjourdrs/codex-test with Contents: read-only. Never paste the token into source or logs."
            exit 1
          fi

      - name: Checkout BatteryLite from the original PRIVATE source repository
        uses: actions/checkout@v4
        with:
          repository: bonjourdrs/codex-test
          ref: battery-lite-oneplus13
          token: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: |
            battery_lite
            v1_0/signing/resourcefinder_debug.keystore.b64
          sparse-checkout-cone-mode: false

      - name: Check expected private source revision
        run: |
          actual=$(git -C private-source rev-parse HEAD)
          echo "Source revision: $actual"
          test "$actual" = 'b2c1507a9e4b2215d7f5a50b0bbecc055396dcfd'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Restore stable existing signing identity in temporary storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base64 --decode private-source/v1_0/signing/resourcefinder_debug.keystore.b64 > "$RUNNER_TEMP/batterylite-stable.keystore"
          echo "BL_KEYSTORE_PATH=$RUNNER_TEMP/batterylite-stable.keystore" >> "$GITHUB_ENV"

      - name: Unit tests and build BatteryLite APK
        working-directory: private-source/battery_lite
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="private-source/battery_lite/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.example.batterylite' versionCode='3' versionName='1.2'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-cert.txt"
          grep -Fi 'Signer #1 certificate SHA-256 digest: 73878e388879a837760bb3c500ff415d0ce54f92cf36b8421557abcf98cfdcf4' "$RUNNER_TEMP/apk-cert.txt"
          cp "$apk" BatteryLite-OnePlus13-v1.2.apk
          sha256sum BatteryLite-OnePlus13-v1.2.apk > BatteryLite-OnePlus13-v1.2.apk.sha256
          cat BatteryLite-OnePlus13-v1.2.apk.sha256

      - name: Upload APK and checksum only
        uses: actions/upload-artifact@v4
        with:
          name: BatteryLite-OnePlus13-v1.2-APK
          path: |
            BatteryLite-OnePlus13-v1.2.apk
            BatteryLite-OnePlus13-v1.2.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test results for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BatteryLite-OnePlus13-v1.2-unit-tests
          path: private-source/battery_lite/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 30
