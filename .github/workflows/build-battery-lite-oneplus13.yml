name: Build BatteryLite OnePlus 13 APK (free public runner)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-battery-lite-oneplus13.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battery-lite-oneplus13-public-build
  cancel-in-progress: true

jobs:
  android:
    # Keep the private-source checkout limited to the repository owner.
    if: github.actor == 'bonjourdrs' && github.repository == 'bonjourdrs/resource-finder-ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify read-only private-source credential exists
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "::error::Missing Actions secret RF_PRIVATE_REPO_READ_TOKEN. Use the existing fine-grained token scoped only to bonjourdrs/codex-test with Contents: read-only. Never paste the token into source or logs."
            exit 1
          fi

      - name: Checkout BatteryLite from the original PRIVATE source repository
        uses: actions/checkout@v4
        with:
          repository: bonjourdrs/codex-test
          ref: battery-lite-oneplus13
          token: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: battery_lite
          sparse-checkout-cone-mode: true

      - name: Record private source revision
        run: git -C private-source rev-parse HEAD

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build BatteryLite APK
        working-directory: private-source/battery_lite
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="private-source/battery_lite/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.example.batterylite' versionCode='1' versionName='1.0'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" BatteryLite-OnePlus13-debug.apk
          sha256sum BatteryLite-OnePlus13-debug.apk > BatteryLite-OnePlus13-debug.apk.sha256
          cat BatteryLite-OnePlus13-debug.apk.sha256

      - name: Upload APK and checksum only
        uses: actions/upload-artifact@v4
        with:
          name: BatteryLite-OnePlus13-APK
          path: |
            BatteryLite-OnePlus13-debug.apk
            BatteryLite-OnePlus13-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
