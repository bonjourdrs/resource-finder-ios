name: Build BatteryLite 1.5 Standalone Signed APK

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-battery-lite-oneplus13.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battery-lite-oneplus13-public-build
  cancel-in-progress: true

jobs:
  android:
    # Keep the private-source checkout limited to the repository owner.
    if: github.actor == 'bonjourdrs' && github.repository == 'bonjourdrs/resource-finder-ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify read-only private-source credential exists
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "::error::Missing Actions secret RF_PRIVATE_REPO_READ_TOKEN. Use the existing fine-grained token scoped only to bonjourdrs/codex-test with Contents: read-only. Never paste the token into source or logs."
            exit 1
          fi

      - name: Checkout BatteryLite from the original PRIVATE source repository
        uses: actions/checkout@v4
        with:
          repository: bonjourdrs/codex-test
          ref: battery-lite-oneplus13
          token: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: battery_lite
          sparse-checkout-cone-mode: true

      - name: Check expected private source revision
        run: |
          actual=$(git -C private-source rev-parse HEAD)
          echo "Source revision: $actual"
          test "$actual" = '918dd2768f12fcbd3522c230f00427b45e79a1fd'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Restore dedicated stable signer from PRIVATE BatteryLite source
        shell: bash
        run: |
          set -euo pipefail
          signer="private-source/battery_lite/signing/batterylite_test_signing.p12.b64"
          pin="private-source/battery_lite/signing/batterylite_test_signing.sha256"
          test -s "$signer"
          test -s "$pin"
          signing_path="$RUNNER_TEMP/batterylite-stable-sideload.p12"
          base64 --decode "$signer" > "$signing_path"
          chmod 600 "$signing_path"
          keytool -list -keystore "$signing_path" -storepass android -alias batterylite >/dev/null
          echo "BL_KEYSTORE_PATH=$signing_path" >> "$GITHUB_ENV"
          echo "BL_SIGNING_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "BL_SIGNING_KEY_ALIAS=batterylite" >> "$GITHUB_ENV"
          echo "BL_SIGNING_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          echo "BL_SIGNING_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Unit tests and build BatteryLite APK
        working-directory: private-source/battery_lite
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="private-source/battery_lite/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.example.batterylite.oneplus13' versionCode='7' versionName='1.5'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-cert.txt"
          actual=$(grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apk-cert.txt" | head -n 1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          expected=$(tr -d '[:space:]' < private-source/battery_lite/signing/batterylite_test_signing.sha256)
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Signer fingerprint mismatch; refusing to publish APK"
            exit 1
          fi
          cp "$apk" BatteryLite-OnePlus13-v1.5-standalone.apk
          sha256sum BatteryLite-OnePlus13-v1.5-standalone.apk > BatteryLite-OnePlus13-v1.5-standalone.apk.sha256
          cat BatteryLite-OnePlus13-v1.5-standalone.apk.sha256

      - name: Upload APK and checksum only
        uses: actions/upload-artifact@v4
        with:
          name: BatteryLite-OnePlus13-v1.5-standalone-APK
          path: |
            BatteryLite-OnePlus13-v1.5-standalone.apk
            BatteryLite-OnePlus13-v1.5-standalone.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test results for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BatteryLite-OnePlus13-v1.5-unit-tests
          path: private-source/battery_lite/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 30
