name: Build Resource Finder 1.9.1 TV Detail Alpha (private source, free public runner)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-resource-finder-android-tv-detail191.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-finder-android-tv-detail191
  cancel-in-progress: true

jobs:
  android:
    # Only the repository owner may run this privileged cross-repository build.
    if: github.actor == 'bonjourdrs' && github.repository == 'bonjourdrs/resource-finder-ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify read-only source credential exists
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "::error::Missing Actions secret RF_PRIVATE_REPO_READ_TOKEN. The secret must be a fine-grained read-only token scoped only to bonjourdrs/codex-test."
            exit 1
          fi

      - name: Checkout only the required files from the PRIVATE source
        uses: actions/checkout@v4
        with:
          repository: bonjourdrs/codex-test
          ref: resource-finder-1.9.1-tv-detail
          token: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: |
            resource_finder/android
            v1_0/signing/resourcefinder_debug.keystore.b64
          sparse-checkout-cone-mode: false

      - name: Record private source revision (SHA only)
        run: |
          git -C private-source rev-parse HEAD | tee private-source-commit.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Restore stable signing key ONLY inside ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base64 --decode private-source/v1_0/signing/resourcefinder_debug.keystore.b64 > "$RUNNER_TEMP/rf-existing-signer.keystore"
          echo "RF_KEYSTORE_PATH=$RUNNER_TEMP/rf-existing-signer.keystore" >> "$GITHUB_ENV"

      - name: Build APK first for early delivery
        working-directory: private-source/resource_finder/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify package, version and original stable signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="private-source/resource_finder/android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='com.resourcefinder.standalone' versionCode='191' versionName='1.9.1-alpha1'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -Fi 'Signer #1 certificate SHA-256 digest: 73878e388879a837760bb3c500ff415d0ce54f92cf36b8421557abcf98cfdcf4'
          cp "$apk" Resource-Finder-v1.9.1-alpha1.apk
          sha256sum Resource-Finder-v1.9.1-alpha1.apk > Resource-Finder-v1.9.1-alpha1.sha256
          cat Resource-Finder-v1.9.1-alpha1.sha256

      - name: Upload signed APK before running the test suite
        uses: actions/upload-artifact@v4
        with:
          name: Resource-Finder-v1.9.1-alpha1-android
          path: |
            Resource-Finder-v1.9.1-alpha1.apk
            Resource-Finder-v1.9.1-alpha1.sha256
            private-source-commit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run Android JVM unit tests and compile instrumentation tests
        working-directory: private-source/resource_finder/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebugAndroidTest --stacktrace

      - name: Upload JVM and instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Resource-Finder-v1.9.1-alpha1-android-test-reports
          path: |
            private-source/resource_finder/android/app/build/reports/tests
            private-source/resource_finder/android/app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 7

# The private source and signing key are never uploaded. Only the signed APK,
# checksum, source commit SHA, and test reports are published as artifacts.
