name: Observe Jianpian TV 4.1.9 in isolated Android TV emulator
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-jianpian-tv-419-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jianpian-tv-runtime-observation
  cancel-in-progress: true

jobs:
  observe:
    if: github.repository == 'bonjourdrs/resource-finder-ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Download public reference APK and verify exact user supplied file hash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jp-observation"
          # Resolve public mirrors via links on the dated reference page.
          curl -fLsS --max-time 40 --user-agent 'Mozilla/5.0' 'https://blog.nickys.cn/?p=669' \
            -o "$RUNNER_TEMP/jp-observation/reference-page.html" || true
          python3 - <<'PY' > "$RUNNER_TEMP/jp-observation/candidate-urls.txt"
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from pathlib import Path
          import os
          p=Path(os.environ["RUNNER_TEMP"])/"jp-observation/reference-page.html"
          class A(HTMLParser):
              def __init__(self): super().__init__();self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      href=dict(attrs).get("href","")
                      if href:self.hrefs.append(href)
          if p.exists():
              parser=A();parser.feed(p.read_text(errors="ignore"))
              for href in parser.hrefs:
                  if "jp_tv_main_419" in href.lower() or ("jianpian" in href.lower() and ".apk" in href.lower()):
                      print(urljoin("https://blog.nickys.cn/?p=669",href))
          print("https://get.downkuai.com/download/186113")
          print("https://www.jianpian.com/jp_tv_main_419.apk")
          print("https://jianpian24.com/jp_tv_main_419.apk")
          PY
          success=0
          while IFS= read -r url; do
            echo "Trying reference URL: $url"
            if curl --fail --location --connect-timeout 15 --max-time 65 \
               --user-agent 'Mozilla/5.0' --output "$RUNNER_TEMP/jp-observation/jp_tv_main_419.apk" "$url"; then
               if echo 'daee9c80478dd0b9adb43f06940c7d0a  '"$RUNNER_TEMP/jp-observation/jp_tv_main_419.apk" | md5sum -c -; then
                 success=1;break
               fi
            fi
          done < "$RUNNER_TEMP/jp-observation/candidate-urls.txt"
          test "$success" = 1 || { echo "::error::No mirror returned the verified 4.1.9 reference APK"; exit 1; }
          file "$RUNNER_TEMP/jp-observation/jp_tv_main_419.apk"
          echo "Reference APK matches user uploaded 4.1.9"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated screenshot script
        run: |
          cat > "$RUNNER_TEMP/jp-observation/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -u
          OUT="$RUNNER_TEMP/jp-observation"
          adb wait-for-device
          adb shell wm size 1920x1080
          adb shell wm density 160
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          adb install -r -g "$OUT/jp_tv_main_419.apk" | tee "$OUT/install.txt"
          adb shell pm list packages | grep 'com.jp3.xg3' | tee "$OUT/package.txt"
          adb shell monkey -p com.jp3.xg3 -c android.intent.category.LAUNCHER 1 | tee "$OUT/launch.txt" || true
          sleep 18
          adb exec-out screencap -p > "$OUT/01-initial.png"
          adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
          adb pull /sdcard/window.xml "$OUT/01-ui.xml" || true
          sleep 30
          adb exec-out screencap -p > "$OUT/02-after-48sec.png"
          adb shell input keyevent KEYCODE_DPAD_CENTER
          sleep 8
          adb exec-out screencap -p > "$OUT/03-confirm.png"
          adb shell input keyevent KEYCODE_DPAD_RIGHT
          adb shell input keyevent KEYCODE_DPAD_CENTER
          sleep 8
          adb exec-out screencap -p > "$OUT/04-right-confirm.png"
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          adb exec-out screencap -p > "$OUT/05-back.png"
          adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
          adb pull /sdcard/window.xml "$OUT/05-ui.xml" || true
          adb shell dumpsys activity top > "$OUT/activity.txt" || true
          adb logcat -d -t 1200 -v brief | grep -E 'com.jp3.xg3|RePlugin|AndroidRuntime|FATAL EXCEPTION|Plugin' | tail -250 > "$OUT/runtime-log.txt" || true
          SH
          chmod +x "$RUNNER_TEMP/jp-observation/capture.sh"
      - name: Start clean Android TV emulator and capture application screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/jp-observation/capture.sh"
      - name: Upload screenshots and UI evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jianpian-TV419-emulator-observation
          path: |
            ${{ runner.temp }}/jp-observation/*.png
            ${{ runner.temp }}/jp-observation/*.xml
            ${{ runner.temp }}/jp-observation/*.txt
          if-no-files-found: warn
          retention-days: 3
