name: BatteryLite 1.4.1 Side-by-side Install Test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-battery-lite-v12.yml', '.github/scripts/batterylite_ui_smoke.py']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download verified BatteryLite APK
        uses: actions/download-artifact@v4
        with:
          name: BatteryLite-OnePlus13-v1.4.1-standalone-APK
          run-id: 42752520801
          github-token: ${{ github.token }}
          path: batterylite
      - name: Download legacy differently signed BatteryLite APK
        uses: actions/download-artifact@v4
        with:
          name: BatteryLite-OnePlus13-v1.4-stable-APK
          run-id: 42749768843
          github-token: ${{ github.token }}
          path: legacy
      - name: Verify legacy APK checksum
        run: |
          cd legacy
          sha256sum -c BatteryLite-OnePlus13-v1.4-stable.apk.sha256
      - name: Verify APK checksum
        run: |
          cd batterylite
          sha256sum -c BatteryLite-OnePlus13-v1.4.1-standalone.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 15 and test navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/batterylite_ui_smoke.py
      - name: Preserve UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BatteryLite-v1.4.1-side-by-side-ui
          path: |
            dashboard.xml
            stats.xml
            diagnostics.xml
            diagnostic-copied.xml
          if-no-files-found: ignore
          retention-days: 15
