name: Audit live Resource Finder catalogs and open-media endpoints

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-resource-finder-source-expansion.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    if: github.actor == 'bonjourdrs' && github.repository == 'bonjourdrs/resource-finder-ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read-only checkout of pinned private source
        uses: actions/checkout@v4
        with:
          repository: bonjourdrs/codex-test
          ref: a71898004669f15d8c47dfe29c2462f1830a21e3
          token: ${{ secrets.RF_PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: resource_finder/android
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Metadata search and detail audit (not playback)
        run: |
          mkdir -p source-audit
          python private-source/resource_finder/android/scripts/source_catalog_audit.py --timeout 7 --out source-audit
      - name: Bounded probe of Blender MP4 endpoints (first KB only)
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, urllib.request, urllib.error
          from pathlib import Path
          code = Path("private-source/resource_finder/android/app/src/main/java/com/resourcefinder/app/data/BlenderOpenMovies.kt").read_text()
          urls = list(dict.fromkeys(re.findall(r'https://video\.blender\.org/static/webseed/[a-f0-9-]+-720\.mp4', code)))
          results = []
          for url in urls:
              started = time.monotonic()
              record = {"url": url, "request": "GET Range bytes=0-1023"}
              try:
                  request = urllib.request.Request(url, headers={"Range": "bytes=0-1023", "User-Agent": "ResourceFinder-Audit/1.9.2"})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      final = response.geturl()
                      if not final.startswith("https://"):
                          raise ValueError("unexpected non-HTTPS redirect")
                      record.update({"code": response.status,
                                     "content_type": response.headers.get("content-type", ""),
                                     "bytes_read": len(response.read(1024)),
                                     "final_https": True})
              except Exception as e:
                  record.update({"error": str(e)[:200]})
              record["duration_ms"] = int((time.monotonic() - started)*1000)
              results.append(record)
          Path("source-audit").mkdir(exist_ok=True)
          Path("source-audit/blender-media-endpoint-check.json").write_text(
              json.dumps({"source_sha": "a71898004669f15d8c47dfe29c2462f1830a21e3", "checks": results,
                          "note": "Reachability probe only; no first-frame or playback evidence"}, indent=2))
          for record in results:
              print(record)
          PY
      - name: Save audit results without changing source flags
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Resource-Finder-source-audit-20261115
          path: source-audit/
          if-no-files-found: warn
          retention-days: 14
