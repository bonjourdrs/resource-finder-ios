name: ResourceFinder
options:
  bundleIdPrefix: com.resourcefinder
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.14.3
targets:
  ResourceFinder:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 资源搜索
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 用于搜索并控制同一 Wi-Fi 内的电视，以及投屏时向电视传输视频。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.resourcefinder.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  ResourceFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ResourceFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ResourceFinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ResourceFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ResourceFinder:
    build:
      targets:
        ResourceFinder: all
    test:
      gatherCoverageData: true
      targets:
        - ResourceFinderTests
        - ResourceFinderUITests
